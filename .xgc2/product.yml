schema: xgc2.product.v1
id: xgc2-camera-calibration-ros1
name: XGC2 ROS1 Camera Calibration
version: 0.4.0-3
kind: ros1-apt
summary: Independent intrinsic and fixed-world-camera extrinsic calibration tools
  for ROS Noetic.
ros:
  distro: noetic
  workspace: catkin
  packages:
  - xgc_camera_calibration
apt:
  distribution: focal
  install:
  - ros-noetic-xgc2-camera-calibration
  packages:
  - ros-noetic-xgc2-camera-calibration
  package_architectures:
    ros-noetic-xgc2-camera-calibration:
    - amd64
    - arm64
  depends:
  - python3-numpy
  - python3-opencv
  - python3-rospkg
  - python3-yaml
  - ros-noetic-gazebo-msgs
  - ros-noetic-geometry-msgs
  - ros-noetic-rosbash
  - ros-noetic-roslaunch
  - ros-noetic-rospy
  - ros-noetic-sensor-msgs
  - ros-noetic-tf
  - ros-noetic-tf2-ros
usage:
  install: 'sudo apt update

    sudo apt install ros-noetic-xgc2-camera-calibration

    '
  smoke_test: |
    /opt/ros/noetic/lib/xgc_camera_calibration/resolve_extrinsic.py --help
  notes: |
    Core owns calibration persistence. The intrinsic and extrinsic private
    http.v1 services expose GET /v1/result for operator review and commit by
    Core. They consume camera capture, compressed ROS images and CameraInfo;
    they never open a camera device. The TF node consumes the immutable pose
    supplied by Core. Intrinsic evidence lives in the private runtime directory.
    Build and runtime images supply Python XRPC 0.2.0 and its dependencies.

ownership:
  paths:
  - /usr/share/xgc2/process-definitions/xgc2-camera-extrinsic-calibrator-ros1.json
  - /usr/share/xgc2/process-definitions/xgc2-camera-extrinsic-tf-ros1.json
  - /usr/share/xgc2/process-definitions/xgc2-camera-intrinsic-calibrator-ros1.json
  - /opt/ros/noetic/share/xgc_camera_calibration
  - /opt/ros/noetic/lib/xgc_camera_calibration
  - /opt/ros/noetic/lib/python3/dist-packages/xgc_camera_calibration
release:
  repository: XGC-Team/xgc2-camera-calibration
  ref: main
  workflow: release.yml
  ci_workflow: ci.yml
  apt_versions:
    focal: 0.4.0-3
